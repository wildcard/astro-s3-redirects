name: Release

on:
  push:
    branches: [main]

concurrency: release-${{ github.ref }}

permissions:
  contents: write # tag + create GitHub Releases
  pull-requests: write # open/update the "Version Packages" PR
  id-token: write # npm provenance (OIDC)

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'
      - run: npm ci
      # Tests gate the publish: the exact commit on main must be green before release.
      - run: npm run typecheck
      - run: npm test # LocalStack E2Es auto-skip (no Docker here)
      - run: npm run build
      # Changesets: with pending changesets → open/update the "Version Packages" PR.
      # When that PR merges (no pending changesets) → version bump, CHANGELOG,
      # git tag, GitHub Release, and npm publish (with provenance).
      - uses: changesets/action@v1
        with:
          version: npx changeset version
          publish: npm run release
          createGithubReleases: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'
